<!DOCTYPE html>
<html lang="ko">
<head>

<title>수억 성장 정원 @우계로357</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --g:#1f6b45; --g2:#2f8a5c; --ink:#1d2f25; --cream:#fffaf1; --red:#d9433e; --gold:#e9b23d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; color:var(--ink); background:#e9f0e8; word-break:keep-all; overscroll-behavior:none; }
  .app { max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--cream); position:relative; overflow:hidden; }
  header { padding:10px 14px 6px; text-align:center; background:linear-gradient(#fffdf8,#fff7ea); border-bottom:1px solid #efe4cf; }
  header { background:radial-gradient(120% 140% at 50% 0%,#fffef9 0%,#fdf6e6 60%,#f7ecd3 100%) !important; }
  header .sub { margin:2px 0 0; display:flex; align-items:center; justify-content:center; gap:8px; font-family:"Gowun Dodum",sans-serif; font-size:14.5px; font-weight:700; color:#b0832a; letter-spacing:3px; }
  header .sub::before, header .sub::after { content:""; width:28px; height:1.5px; background:linear-gradient(90deg,transparent,#d9b366); }
  header .sub::after { transform:scaleX(-1); }
  header h1 { margin:7px 0 10px; display:flex; align-items:baseline; justify-content:center; gap:3px; line-height:1.1; }
  header h1 .t { font-family:"Gowun Batang",serif; font-size:31px; font-weight:700; letter-spacing:-.5px; color:#1e3a5f; text-shadow:0 1px 0 #fff, 0 3px 6px rgba(30,58,95,.12); }
  header h1 .at { font-family:"Gowun Batang",serif; font-size:18px; font-weight:700; letter-spacing:0; color:#9a7424; }

  .chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }

  .steps { list-style:none; display:flex; justify-content:center; align-items:center; gap:4px; margin:0 6px; padding:8px 0 0; border-top:1px solid #eadfc6; }
  .steps li { display:flex; align-items:center; gap:5px; font-size:13.5px; white-space:nowrap; font-weight:800; color:#8a9a8f; padding:4px 10px 4px 5px; border-radius:20px; background:#f1f4ef; transition:.25s; }
  .steps li i { font-style:normal; width:21px; height:21px; border-radius:50%; background:#c9d3cb; color:#fff; font-size:12.5px; display:grid; place-items:center; }
  .steps li + li { margin-left:14px; position:relative; }
  .steps li + li::before { content:"›"; position:absolute; left:-13px; color:#b9c4bc; font-weight:900; }
  .steps li[data-s="1"] { --c:#6cc08b; --p:#e8f6ed; } .steps li[data-s="2"] { --c:#2f9a62; --p:#dcefe3; } .steps li[data-s="3"] { --c:#17583a; --p:#d3e6da; }
  .steps li { background:var(--p); color:var(--c); } .steps li i { background:var(--c); }
  .steps li.on { background:var(--c); color:#fff; box-shadow:0 3px 8px rgba(31,107,69,.35); transform:scale(1.07); }
  .steps li.on i { background:#fff; color:var(--c); }
  .steps li.done { opacity:.75; } .steps li.done i { font-size:0; } .steps li.done i::after { content:"✓"; font-size:12.5px; }
  .stepbadge { display:table; margin:0 auto 4px; font-size:13.5px; font-weight:900; color:#fff; padding:3px 12px; border-radius:20px; background:var(--sc); }
  .panel[data-step="1"] { --sc:#6cc08b; } .panel[data-step="2"] { --sc:#2f9a62; } .panel[data-step="3"] { --sc:#17583a; }
  .panel[data-step] .big:not(.alt) { background:linear-gradient(90deg,var(--sc),color-mix(in srgb,var(--sc) 75%,#0e3a25)); }
  .panel[data-step] .ttl { color:color-mix(in srgb,var(--sc) 55%,#1d2f25); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .tiles button { border:1.5px solid #e3eadf; background:#fbfdf9; border-radius:14px; padding:10px 4px 9px; font:inherit; font-size:14.5px; font-weight:800; color:var(--ink); cursor:pointer; line-height:1.3; }
  .tiles .ic { display:block; font-size:26px; margin-bottom:3px; }
  .tiles small { display:block; font-size:12.5px; color:#8a9a8f; font-weight:700; }
  .lead { text-align:center; font-size:16px; font-weight:800; color:#3d5345; margin:2px 0 0; line-height:1.5; }
  .lead b { color:var(--g); }
  .foot { margin-top:16px; padding-top:10px; border-top:1px dashed #e6e0d2; text-align:center; font-size:13px; color:#8a8f86; line-height:1.7; }
  .foot b { color:#1f6b45; } .foot a { color:#9a8f7a; text-decoration:none; }
  .ttl { text-align:center; font-size:22px; font-weight:900; margin:4px 0 12px; }
  .nwq { white-space:nowrap; }
  .ttl q { quotes:"“" "”"; color:var(--sc,#1f6b45); }
  .ttl small { display:block; font-size:16px; font-weight:800; color:#b07a12; margin-top:2px; }
  .slotHint { visibility:hidden; }
  .scene.drop .slotHint { visibility:visible; }
  /* scene */
  .scene { position:relative; width:100%; aspect-ratio:4/4.8; overflow:hidden; background:#cfe3f3; }
  .layer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 70%; pointer-events:none; }
  @keyframes swayL { 0%,100%{transform:skewX(0deg)} 50%{transform:skewX(1.6deg)} }
  @keyframes swayR { 0%,100%{transform:skewX(0deg)} 50%{transform:skewX(-1.6deg)} }
  .fl { transform-origin:50% 100%; }
  .fl.l { animation:swayL 3.2s ease-in-out infinite; } .fl.r { animation:swayR 3.6s ease-in-out infinite; animation-delay:-1s; }
  .frame { position:absolute; right:3%; top:3%; width:44%; background:#fff; padding:4px; border-radius:6px; box-shadow:0 6px 16px rgba(30,40,30,.25); border:3px solid #c9a35a; cursor:pointer; }
  .frame canvas { display:block; width:100%; aspect-ratio:21/17; border-radius:2px; }

  .principal { position:absolute; left:0%; bottom:7%; width:27%; cursor:pointer; filter:drop-shadow(0 6px 6px rgba(0,0,0,.18)); transform-origin:50% 100%; }
  .bubble { position:absolute; left:2.5%; top:4%; width:49%; box-sizing:border-box; background:linear-gradient(#fffefa,#fff6e6); border:2px solid #f0dcb0; border-radius:18px; padding:10px 10px; text-align:center; font-family:"Gowun Batang",serif; font-size:22px; font-weight:700; color:#7a4520; line-height:1.45; letter-spacing:-.3px; box-shadow:0 6px 14px rgba(0,0,0,.15); }
  .bubble .nw { white-space:nowrap; display:inline-block; }
  .bubble::after { content:""; position:absolute; left:26px; bottom:-12px; border:8px solid transparent; border-top:12px solid #f0dcb0; }
  .bubble small { display:block; font-size:13.2px; font-weight:700; color:#6d8a76; margin-top:2px; }
  .combo { position:absolute; left:28.5%; bottom:2.5%; width:42%; }
  .combo .unit { position:relative; display:flex; align-items:flex-end; justify-content:space-between; padding:0 1% 0 0; }
  .bankwrap { position:relative; width:74%; z-index:2; }
  .bank { position:relative; width:100%; aspect-ratio:700/824; filter:drop-shadow(0 10px 12px rgba(20,60,40,.28)); }
  .bank svg, .bank img { position:absolute; inset:0; width:100%; height:100%; }
  .bank img { opacity:.4; mix-blend-mode:luminosity; }
  .slot { position:absolute; left:50%; top:9%; width:32%; height:3.6%; transform:translateX(-50%); background:linear-gradient(#0d2a1c,#1f4a33); border-radius:20px; }
  .thermo { position:relative; width:17%; margin-bottom:1%; z-index:2; }

  .me { position:absolute; right:0%; bottom:7%; width:29%; filter:drop-shadow(0 6px 6px rgba(0,0,0,.18)); transform-origin:50% 100%; display:none; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-14%) rotate(-4deg)} 60%{transform:translateY(0) rotate(3deg)} }
  .hop { animation:hop .7s ease 2; }

  .wob { animation:wob .5s ease; }

  /* panel */
  .panel { flex:1; padding:14px 14px 18px; background:#fff; border-radius:20px 20px 0 0; margin-top:-16px; position:relative; box-shadow:0 -6px 16px rgba(0,0,0,.06); }

  .opt { border:2px solid #e3eadf; background:#fbfdf9; border-radius:16px; padding:12px 8px; font:inherit; font-size:18px; font-weight:800; color:var(--ink); cursor:pointer; text-align:center; min-height:62px; }

  .card .src { font-size:14.4px; color:#8b7c5a; margin-top:6px; }

  .result .n { font-size:18px; font-weight:800; line-height:1.6; }

  .row { display:flex; gap:8px; }

  .mini { display:flex; justify-content:center; gap:14px; margin-top:12px; }
  .mini button { border:0; background:none; font:inherit; font-size:15.6px; font-weight:800; color:#5d6f63; text-decoration:underline; cursor:pointer; }
  .back { position:absolute; left:12px; top:12px; border:0; background:#f1f5f0; border-radius:20px; padding:5px 11px; font:inherit; font-size:15px; font-weight:800; color:#56685c; cursor:pointer; }
  .lantern { display:block; text-align:center; margin-top:14px; font-size:14.4px; color:#9a8f7a; text-decoration:none; }

  /* overlays */
  .fly { position:fixed; width:30px; height:30px; z-index:40; pointer-events:none; }
  .spark { position:fixed; width:8px; height:8px; border-radius:50%; z-index:41; pointer-events:none; }
  .toast { position:fixed; left:50%; top:16px; transform:translate(-50%,-30px); opacity:0; background:#fff; border:2px solid var(--gold); border-radius:16px; padding:10px 18px; font-weight:900; font-size:18px; text-align:center; box-shadow:0 10px 24px rgba(0,0,0,.15); transition:.35s; z-index:50; width:max-content; max-width:92vw; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .modal.show { display:flex; }
  .sheet { background:#fff; border-radius:20px; width:100%; max-width:440px; max-height:88vh; overflow:auto; padding:16px; position:relative; }
  .sheet h3 { margin:0 0 10px; font-size:20.4px; text-align:center; }
  .sheet .x { position:sticky; float:right; top:0; margin:-6px -6px 0 0; width:42px; height:42px; border-radius:50%; border:0; background:#1f6b45; color:#fff; font-size:26px; font-weight:900; line-height:42px; cursor:pointer; z-index:2; box-shadow:0 3px 8px rgba(0,0,0,.2); }
  .toast .tx { margin-left:10px; border:0; background:#f1e3bd; border-radius:50%; width:28px; height:28px; font-weight:900; font-size:18px; cursor:pointer; vertical-align:middle; }
  .sheet canvas { width:100%; border-radius:8px; display:block; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { border:1.5px solid #dfe8e1; background:#fff; border-radius:20px; padding:6px 12px; font:inherit; font-size:15.6px; font-weight:800; cursor:pointer; }
  .tabs button.on { background:var(--g); color:#fff; border-color:var(--g); }
  .dex { display:grid; grid-template-columns:1fr; gap:8px; }
  .dex > div { border-radius:12px; padding:10px 12px; text-align:center; }
  .dex .on { background:linear-gradient(#fffaf0,#fbf1dc); border:1.5px solid #ecd9a8; }

  {tip:"배운 것을 스스로 돌아봐요", o:"때때로 익힌 공부를 스스로 점검하고, 마음 깊이 새겨 실천하며, 마음이 흐트러지지 않게 한다.", s:"우계 성혼(1535~1598), 「서실의」 제20조"},

/* ===== 저장소: 지금은 이 기기(localStorage). 서버판에서는 이 부분만 서버 API로 바꾸면 됩니다 ===== */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const Shared = {   // 모두가 함께 보는 값 (서버판에서 교체)

};

function newOrder(r=0){ let t=((r+1)*2654435761)>>>0; const rnd=()=>{ t=(t+0x6D2B79F5)>>>0; let x=t; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; };
  const a=[...Array(CELLS).keys()]; for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }   // 판 번호로 순서가 정해져 모든 기기에서 같은 칸이 열려요

/* ===== 서버판: 같은 주소에 /api 가 있으면 학교 전체 조각 수를 함께 셉니다 (없으면 이 기기에만 저장) ===== */

function applyServer(st){ S={count:st.count, round:st.round, total:st.total, gallery:st.gallery||[], order:newOrder(st.round)}; Shared.save(S); }
async function syncServer(){ try{ const r=await fetch(API+"/state",{cache:"no-store"}); if(!r.ok) return; const st=await r.json(); if(typeof st.count!=="number") return;
  const before=S.round+":"+S.count; SERVER=true; applyServer(st); if(before!==S.round+":"+S.count){ renderTop(); setGauges(false); } }catch(e){} }
async function postPledge(){ try{ const r=await fetch(API+"/pledge",{method:"POST",cache:"no-store"}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const $=id=>document.getElementById(id);
const fmtO=o=>"“"+o.split(/(?<=[.,])\s+/).join("<br>")+"”";   // 원문 풀이: 쉼표·마침표마다 줄바꿈
const ymd=d=>(d||"").slice(2).replace(/-/g,".")+".";   // 2026-11-12 → 26.11.12.

/* ===== 그림 ===== */
const pics=[];
function loadPics(){ return Promise.all(PICTURES.map(src=>new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=src; }))).then(a=>{ a.forEach((x,i)=>{ if(x){ x._src=PICTURES[i]; pics.push(x); } }); }); }
function curPic(){ return pics.length? pics[S.round % pics.length] : null; }
function drawBoard(cv,hl){

      cells+= g? `<figure class="done"><img src="${pic}" alt=""><figcaption><b>ver${i+1}.</b> 완성날짜: ${ymd(g.date)}</figcaption></figure>`

    h+=`<h3>📖 완성 앨범</h3><p class="hint">119조각을 모을 때마다 그림 1점이 액자에 걸려요.<br>그림 3점(357조각)이 모이면 앨범 1권이 완성되고, 다음 권이 이어져요.</p><div class="gal">${cells}</div>`; }
  sh.innerHTML=h; $("modal").classList.add("show");
  $("x").onclick=()=>{ $("modal").classList.remove("show"); if(kind==="done") endDemo(); };
  if($("copyBtn")) $("copyBtn").onclick=copyLink;
  if($("sendCard")) $("sendCard").onclick=async()=>{ if(!(await shareCardFile())) toast("이 화면에서는 카톡으로 바로 보낼 수 없어요. 카드를 저장한 뒤 카톡 대화창에서 사진으로 보내 주세요 🎁",3400); };
  if($("dlCard")) $("dlCard").onclick=saveCardFile;
  document.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>switchTheme(b.dataset.t));
  if($("demo")) $("demo").onclick=()=>{ $("modal").classList.remove("show"); demoComplete(); };
  if($("bigBoard")) drawBoard($("bigBoard"));
  if($("doneBoard")){ const cv=$("doneBoard"), g=S.gallery[S.gallery.length-1]; const im=new Image(); im.onload=()=>cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); im.src=g.pic; burst(cv,40); }
}
$("modal").onclick=e=>{ if(e.target.id==="modal"){ $("modal").classList.remove("show"); endDemo(); } };
$("frame").onclick=()=>openInfo("board");

/* ===== 관리자 (주소 끝에 ?admin) ===== */
if(location.search.includes("admin")){ setTimeout(()=>{ const b=document.createElement("button"); b.textContent="관리자: 조각 수 0으로"; b.className="big alt"; b.onclick=()=>{ if(confirm('정말 0으로 되돌릴까요?')){ S={count:0,round:0,total:0,order:newOrder(0),gallery:[]}; Shared.save(S); renderTop(); setGauges(true); } }; P.appendChild(b);
  const b2=document.createElement("button"); b2.textContent="시연: 118조각으로"; b2.className="big alt"; b2.onclick=()=>{ S=Shared.load(); S.count=TOTAL-1; Shared.save(S); renderTop(); setGauges(true); }; P.appendChild(b2); },300); }

/* ===== 시작 ===== */
loadPics().then(()=>{ renderTop(); });
setMe(); setGauges(true); renderTop(); screenStart();
setTimeout(()=>bounce($("principal"),"hop"),400);
function fitBubble(){ const b=$("bubble"); if(!b||b.offsetParent===null) return; let f=22; b.style.fontSize=f+"px";
  const over=()=>[...b.querySelectorAll(".nw")].some(x=>x.offsetWidth>b.clientWidth-26);
  while(f>14 && over()){ f-=0.5; b.style.fontSize=f+"px"; } }
window.addEventListener("resize",fitBubble); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitBubble); setTimeout(fitBubble,50); setTimeout(fitBubble,1500);
syncServer(); setInterval(()=>{ if(!document.hidden && !demoSnap && !locked) syncServer(); },10000);
$("principal").onclick=()=>{ AC(); principalDance(); };
setTimeout(()=>principalDance(true),1200); setInterval(()=>{ if(!document.hidden && !$("modal").classList.contains("show")) principalDance(true); },15000);
</script>
</body>
</html>
